version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      bibliotheken:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /qa
    schedule:
      interval: weekly
    groups:
      testwerkzeuge:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
